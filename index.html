<!DOCTYPE html><html><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>TRIAL - Audit Intelligence USA - BASA</title><style>body{font-family:Arial;background:#0f172a;color:white;margin:0;padding:0}.hero{background:linear-gradient(135deg,#003366,#00d084);padding:25px;text-align:center}.card{background:white;color:#0f172a;padding:20px;border-radius:16px;max-width:900px;margin:20px auto}.btn{padding:12px 18px;border-radius:8px;font-weight:bold;border:none;margin:5px;display:inline-block;text-decoration:none;cursor:pointer}.verde{background:#00d084;color:white;width:100%;font-size:16px}.azul{background:#003366;color:white}input,select{width:100%;padding:10px;border:2px solid #cbd5e1;border-radius:8px;margin:6px 0}</style></head><body>
<div class="hero"><h1>AUDIT INTELLIGENCE USA - BASA V14</h1><p>TRIAL - Registro SaaS | BHD 08694150021 | USD250 x módulo</p><p id="ruta" style="background:rgba(0,0,0,0.3);padding:6px;border-radius:6px;display:inline-block"></p></div>
<div class="card">
<h2 style="color:#003366">Formulario Trial - Activar Cuenta</h2>
<form id="auditSaaSForm" onsubmit="return integrarCliente(event)">
<label>Empresa / Entidad:</label><input id="empresa" placeholder="Ej: Ayuntamiento..." required>
<label>RNC / Cédula:</label><input id="rnc" placeholder="001-00000-1" required>
<label>Email Corporativo:</label><input id="email" type="email" placeholder="gerencia@empresa.com" required>
<label>País:</label><select id="pais"><option value="DO">Rep. Dominicana - NOBACI</option><option value="US">Estados Unidos - FAR</option><option value="MX">México</option><option value="PA">Panamá</option></select>
<label><input type="checkbox" id="aceptaContrato" required style="width:20px;height:20px"> Acepto Contrato SaaS BASA - Firma digital Ley 126-02 + ESIGN + eIDAS + Políticas NOBACI</label>
<div style="background:#ecfdf5;padding:10px;border-radius:8px;margin:10px 0"><b>Resumen:</b> B4 Base + NOBACI + Pagos + Inventarios = 4 módulos = USD$1000 + ITBIS<br><b>BHD:</b> 08694150021 USD/DOP</div>
<button type="submit" class="btn verde">✅ Activar Cuenta y Generar Contrato Real</button>
</form>
<div id="res" style="display:none;margin-top:15px;padding:15px;background:#f0fdf4;border-radius:10px;border:2px solid #00d084"></div>
<div style="margin-top:15px;text-align:center"><a href="https://basa-v7-1.onrender.com/gestion-informes" target="_blank" class="btn azul">📄 Gestión Informes y Réplicas + Historial (NUEVO)</a><a href="https://basa-v7-1.onrender.com/b4" target="_blank" class="btn azul" style="background:#6b7280">B4 Informe IA</a></div>
</div>
<script>
document.getElementById('ruta').innerText='Ruta: '+window.location.pathname+' - FIX 200 OK - '+new Date().toLocaleString();
function integrarCliente(e){
 e.preventDefault();
 var empresa=document.getElementById('empresa').value, rnc=document.getElementById('rnc').value, email=document.getElementById('email').value, pais=document.getElementById('pais').value;
 var btn=e.target.querySelector('button'); btn.innerHTML='Generando...';
 fetch('https://basa-v7-1.onrender.com/api/activar-saas',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({empresa:empresa,rnc:rnc,email:email,pais:pais,mods:['B4_BASE','M9_NOBACI','M11_PAGOS','M10_INV']})}).then(r=>r.json()).then(d=>{
  var res=document.getElementById('res'); res.style.display='block';
  res.innerHTML='<h3 style="color:#00a86b">✅ Registro exitoso: '+empresa+'</h3><p><b>Contrato:</b> '+d.contrato+'<br><b>Total:</b> USD$'+d.total+'<br><b>BHD:</b> 08694150021</p><a href="https://basa-v7-1.onrender.com/api/contrato/'+d.contrato+'" target="_blank" class="btn verde" style="width:auto">📄 Descargar Contrato PDF Real Funcional</a><br><br><a href="https://basa-v7-1.onrender.com/gestion-informes" target="_blank" class="btn azul">➡️ Ir a Gestión Informes y Réplicas + Historial</a>';
  btn.innerHTML='✅ Activar Cuenta y Generar Contrato Real';
 }).catch(()=>{btn.innerHTML='Error - Intente de nuevo'; alert('Error, use https://basa-v7-1.onrender.com/contrato directo');});
 return false;
}
</script></body></html>
